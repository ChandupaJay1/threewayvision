    <style>

            --accent-gold: #fbbf24; /* Premium Champagne Gold */
            --text-light: #f8fafc;
            --text-muted: #a7f3d0;
            --border-color: rgba(251, 191, 36, 0.25);
            --danger-red: #f87171;

            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            overflow: hidden;
            height: 100vh;
        }

            position: relative;
            width: 100%;
            height: 100vh;

            justify-content: space-between;
            background-size: cover;
            background-position: center;
            transition: background-image 0.6s ease-in-out;

            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(6, 78, 59, 0.98) 0%, rgba(2, 43, 32, 0.9) 100%);

        }

        header {

            z-index: 10;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2, 43, 32, 0.95);
            border-bottom: 2px solid var(--accent-gold);
        }

        .logo-section h1 {
            font-size: 22px;
            color: var(--accent-gold);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .lang-switcher button {

            color: var(--text-light);
            padding: 10px 22px;
            margin-left: 8px;
            cursor: pointer;
            font-weight: 600;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .lang-switcher button.active, .lang-switcher button:hover {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #064e3b;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);

            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border-left: 5px solid var(--accent-gold);
            box-shadow: 0 25px 55px rgba(0,0,0,0.6);

            overflow-y: auto;

            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;

        h2 {

            margin-bottom: 22px;
            color: #ffffff;
            font-weight: 600;
        }

        .framework-badge {
            display: inline-block;
            background: var(--accent-gold);
            color: #064e3b;
            padding: 3px 12px;
            font-weight: 800;
            border-radius: 4px;
            margin-right: 10px;
            font-size: 16px;
            vertical-align: middle;

            line-height: 1.8;
            color: #f1f5f9;
            text-align: justify;

            margin-bottom: 18px;
        }

            grid-template-columns: 1.1fr 0.9fr;
            gap: 35px;
            margin-top: 20px;
        }

            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-height: 310px;

            justify-content: center;
            align-items: center;

            padding: 12px;
            margin-bottom: 18px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: #022b20;
            color: #ffffff;

            font-size: 15px;

            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #022b20;
            color: var(--accent-gold);
            font-weight: 700;
            border-bottom: 2px solid var(--accent-gold);

        tr:nth-child(even) {

            margin-bottom: 12px;

            border-left: 4px solid var(--accent-gold);
            padding-left: 15px;
            font-style: italic;
            color: var(--text-muted);

            z-index: 10;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2, 43, 32, 0.95);
            border-top: 1px solid rgba(255,255,255,0.1);

            background: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 600;

            color: var(--accent-gold);
            letter-spacing: 1px;

</head>

<div class="dashboard-container" id="dynamic-bg">

    <header>

                options: { 
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#ffffff', font: { size: 12 } } } },
                    scales: { r: { grid: { color: 'rgba(255,255,255,0.1)' }, angleLines: { color: 'rgba(255,255,255,0.1)' }, pointLabels: { color: '#ffffff', font: { size: 11 } } } }
                }
            });
        }

        // Slide 4 (Index 4) - GDP & Rural Wealth Growth Chart
        const gdpCanvas = document.getElementById('gdpGrowthChart');
        if (gdpCanvas) {
            primaryChartInstance = new Chart(gdpCanvas, {
                type: 'line',
                data: {
                    labels: selectedLang === 'si' ? ['වසම් දත්ත', 'ඩිජිටල් කේන්ද්‍රය', 'Layer-B බද්ධය', 'සෘජු වෙළඳපොළ', 'ප්‍රඥාවන්ත ව්‍යවසාය'] : 
                            selectedLang === 'ta' ? ['பிரிவு தரவு', 'டிஜிட்டல் மையம்', 'Layer-B இணைப்பு', 'நேரடி சந்தை', 'சுயாதீன தொழில்முனைவு'] :
                            ['Division Data', 'Digital Hub', 'Layer-B Integration', 'Direct Market', 'Empowered Enterprise'],
                    datasets: [{
                        label: selectedLang === 'si' ? 'ග්‍රාමීය ආර්ථික පිබිදීම %' : selectedLang === 'ta' ? 'கிராமப்புற பொருளாதார எழுச்சி %' : 'Rural Economic Growth %',
                        data: [20, 45, 70, 90, 98],
                        borderColor: '#fbbf24',
                        backgroundColor: 'rgba(251, 191, 36, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#ffffff' } } },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#ffffff' } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#ffffff' }, min: 0, max: 100 }
                    }
                }
            });
        }
    }

    function paintDashboard() {
        const structuralData = datasetMatrix[selectedLang][activeSlideIndex];
        const localizationLabels = viewLabels[selectedLang];
        
        document.getElementById('top-header-title').innerText = localizationLabels.headerText;
        document.getElementById('window-title').innerText = localizationLabels.headerText;
        
        document.getElementById('slide-main-title').innerHTML = structuralData.title;
        document.getElementById('slide-main-body').innerHTML = structuralData.bodyHtml;
        
        const userSearch = document.getElementById('tableFilterInput');
        if (userSearch) userSearch.placeholder = localizationLabels.searchPlaceholder;
        
        const h1 = document.getElementById('col-h1'); if (h1) h1.innerText = localizationLabels.tableHeaders[0];
        const h2 = document.getElementById('col-h2'); if (h2) h2.innerText = localizationLabels.tableHeaders[1];
        const h3 = document.getElementById('col-h3'); if (h3) h3.innerText = localizationLabels.tableHeaders[2];
        
        const arrayLength = datasetMatrix[selectedLang].length;
        const outText = `${localizationLabels.pageLabel} ${activeSlideIndex + 1} / ${arrayLength}`;
        document.getElementById('slide-index-label').innerText = outText;
        document.getElementById('slide-counter-bottom').innerText = outText;
        
        document.getElementById('dynamic-bg').style.backgroundImage = `url('${structuralData.bgImage}')`;

        document.getElementById('prev-slide-btn').disabled = (activeSlideIndex === 0);
        document.getElementById('next-slide-btn').disabled = (activeSlideIndex === arrayLength - 1);

        setTimeout(renderActiveCharts, 60);
    }

    function changeSlide(directionOffset) {
        activeSlideIndex += directionOffset;
        const totalSlides = datasetMatrix[selectedLang].length;
        if(activeSlideIndex < 0) activeSlideIndex = 0;
        if(activeSlideIndex >= totalSlides) activeSlideIndex = totalSlides - 1;
        paintDashboard();
    }

    function switchLanguage(langKey) {
        selectedLang = langKey;
        document.getElementById('lang-si').classList.remove('active');
        document.getElementById('lang-ta').classList.remove('active');
        document.getElementById('lang-en').classList.remove('active');
        document.getElementById('lang-' + langKey).classList.add('active');
        paintDashboard();
    }

    function filterTableRows() {
        let input = document.getElementById("tableFilterInput");
        let filter = input.value.toUpperCase();
        let table = document.getElementById("contentDataTable");
        let tr = table.getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) {
            let rowText = tr[i].textContent || tr[i].innerText;
            if (rowText.toUpperCase().indexOf(filter) > -1) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }

    window.onload = function() {
        paintDashboard();
    };
</script>

</body>
</html>
