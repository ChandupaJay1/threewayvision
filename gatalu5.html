    <style>
        :root {
            /* New Premium Theme: Cyber Punk Orange & Dark Charcoal */
            --gradient-main: linear-gradient(135deg, #f97316 0%, #ea580c 40%, #c2410c 80%, #7c2d12 100%);
            --bg-dark: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.95);
            --accent-orange: #ff7a00;
            --accent-glow: #fdba74;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(249, 115, 22, 0.25);
            --success-green: #4ade80;
            --danger-red: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
        }

        .dashboard-container {
            display: grid;
            grid-template-rows: 70px 1fr 50px;
            height: 100vh;
            width: 100vw;
        }

        /* Top Navigation Header */
        header {
            background: #111827;
            border-bottom: 2px solid var(--accent-orange);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .brand-title {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title span {
            color: var(--accent-orange);
        }

        .lang-bar {
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-muted);
            padding: 6px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .lang-btn:hover, .lang-btn.active {
            background: var(--gradient-main);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.4);
        }

        /* Main Workspace Grid */
        main {
            display: grid;
            grid-template-columns: 1.35fr 1fr;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        .left-panel {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 15px;
            overflow: hidden;
        }

        .right-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 22px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .meta-card {
            background: rgba(249, 115, 22, 0.04);
            padding: 14px 20px;
            border-radius: 8px;
            border: 1px solid rgba(249, 115, 22, 0.15);
            border-left: 4px solid var(--accent-orange);
        }

        .meta-title {
            font-size: 0.75rem;
            color: var(--accent-glow);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 3px;
        }

        .meta-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-light);
        }

        /* Slide Dynamic Container */
        .slide-container {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }

        .abcd-badge {
            display: inline-block;
            background: var(--gradient-main);
            color: #ffffff;
            font-weight: 900;
            font-size: 1.5rem;
            width: 45px;
            height: 45px;
            line-height: 45px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .slide-title {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 700;
            border-left: 3px solid var(--accent-orange);
            padding-left: 10px;
        }

        .slide-desc {
            font-size: 0.98rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 22px;
            text-align: justify;
        }

        /* Matrix Elements */
        .matrix-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .matrix-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-right: 3px solid var(--accent-orange);
            padding: 14px 18px;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .matrix-item:hover {
            background: rgba(249, 115, 22, 0.05);
            transform: translateY(-2px);
        }

        .section-heading {
            font-size: 1.1rem;
            color: var(--accent-glow);
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.9rem;
        }

        .data-table th {
            text-align: left;
            padding: 12px;
            background: #111827;
            color: var(--accent-glow);
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .data-table td {
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            color: #cbd5e1;
        }

        .data-table tr:nth-child(even) {
            background: rgba(255,255,255,0.01);
        }

        /* Footer Controls */
        footer {
            background-color: #090d16;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
        }

        .nav-controls {
            display: flex;
            gap: 12px;
        }

        .control-btn {
            background: #1f2937;
            border: 1px solid var(--accent-orange);
            color: #ffffff;
            padding: 8px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: var(--gradient-main);
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.3);
        }

        .control-btn:disabled {
            background: #111827;
            border-color: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.2);
            cursor: not-allowed;
            box-shadow: none;
        }

        .footer-note {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-orange); border-radius: 2px; }
    </style>
</head>

        let activeSlideIndex = 0;
        let selectedLang = 'si'; // Default Language

        function paintDashboard() {
            const currentData = datasetMatrix[selectedLang][activeSlideIndex];
            if (!currentData) return;
            
            document.getElementById('slide-letter').innerText = currentData.letter;
            document.getElementById('meta-display').innerText = currentData.meta;
            document.getElementById('slide-main-title').innerText = currentData.title;
            document.getElementById('slide-main-desc').innerText = currentData.desc;
            document.getElementById('buddhist-desc').innerText = currentData.buddhist;

            const matrixBox = document.getElementById('slide-matrix-box');
            matrixBox.innerHTML = '';
            currentData.matrix.forEach(item => {
                const li = document.createElement('li');
                li.className = 'matrix-item';
                li.innerText = item;
                matrixBox.appendChild(li);
            });

            const headerRow = document.getElementById('table-header-row');
            headerRow.innerHTML = `
                <th>${currentData.th1}</th>
                <th>${currentData.th2}</th>
                <th>${currentData.th3}</th>
            `;

            const tableBody = document.getElementById('table-body-rows');
            tableBody.innerHTML = '';
            currentData.table.forEach(rowData => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${rowData[0]}</strong></td>
                    <td style="color: var(--danger-red); font-weight: 600;">${rowData[1]}</td>
                    <td style="color: var(--success-green); font-weight: 600;">${rowData[2]}</td>
                `;
                tableBody.appendChild(tr);
            });

            document.getElementById('btn-prev').disabled = (activeSlideIndex === 0);
            document.getElementById('btn-next').disabled = (activeSlideIndex === datasetMatrix[selectedLang].length - 1);

                document.getElementById('section-buddhist-title').innerText = "රාජ්‍ය පාලනය සහ ආර්ථික සදාචාරය පිළිබඳ බුද්ධ උපදේශිත දර්ශනය";
                document.getElementById('section-data-title').innerText = "සැපයුම් දාම විනිවිදභාවය සහ පිරිවැය විශ්ලේෂණ වගුව";
                document.getElementById('meta-tag').innerText = "උපායමාර්ගික කුළුණු නිරීක්ෂකය";
                document.getElementById('footer-text').innerText = "තුන්කල් දැක්ම © 2026 | අතරමැදි සූරාකෑම වැළැක්වීමේ ජාතික පද්ධතිය";
                document.getElementById('btn-prev').innerText = "← පසුපසට";
                document.getElementById('btn-next').innerText = "ඉදිරියට →";
            } else if(selectedLang === 'ta') {
                document.getElementById('main-brand-title').innerHTML = "<span>✦</span> THREE-WAY VISION | விநியோகச் சங்கிலி சமநிலை மேட்ரிக்ஸ்";
                document.getElementById('section-buddhist-title').innerText = "அரசாட்சி மற்றும் பொருளாதார நெறிமுறைகள் குறித்த பௌத்த தத்துவம்";
                document.getElementById('section-data-title').innerText = "விநியோகச் சங்கிலி வெளிப்படைத்தன்மை மற்றும் செலவு பகுப்பாய்வு அட்டவணை";
                document.getElementById('meta-tag').innerText = "STRATEGIC PILLAR MONITOR";
                document.getElementById('footer-text').innerText = "THREE-WAY VISION © 2026 | சுரண்டல் எதிர்ப்பு முறைமை";
                document.getElementById('btn-prev').innerText = "← பின்னே";
                document.getElementById('btn-next').innerText = "அடுத்தது →";
            } else {
                document.getElementById('main-brand-title').innerHTML = "<span>✦</span> THREE-WAY VISION | SUPPLY CHAIN EQUALIZATION MATRIX";
                document.getElementById('section-buddhist-title').innerText = "Canonical Buddhist Doctrine on Governance & Economic Ethics";
                document.getElementById('section-data-title').innerText = "Supply Chain Transparency & Cost Analysis Matrix Table";
                document.getElementById('meta-tag').innerText = "STRATEGIC PILLAR MONITOR";
                document.getElementById('footer-text').innerText = "THREE-WAY VISION © 2026 | ANTI-EXPLOITATION MATRIX SYSTEM";
                document.getElementById('btn-prev').innerText = "← BACK";
                document.getElementById('btn-next').innerText = "NEXT →";
            }
        }

        function changeSlide(direction) {
            activeSlideIndex += direction;
            if(activeSlideIndex < 0) activeSlideIndex = 0;
            if(activeSlideIndex >= datasetMatrix[selectedLang].length) {
                activeSlideIndex = datasetMatrix[selectedLang].length - 1;
            }
            paintDashboard();
        }

        function switchLanguage(langKey) {
            selectedLang = langKey;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('lang-' + langKey).classList.add('active');
            paintDashboard();
        }

        window.onload = function() {
            paintDashboard();
        };
    </script>
