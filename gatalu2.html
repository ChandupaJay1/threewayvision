<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="window-title">තුන්කල් දැක්ම | ග්‍රාමීය ණය උගුල් පද්ධතිමயமாக තුරන් කිරීමේ ජාතික මාර්ග සිතියම</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --accent-gold: #fbbf24;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(251, 191, 36, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #020617;
            color: var(--text-light);
            overflow: hidden;
            height: 100vh;
            transition: background 0.6s ease;
        }

        .dashboard-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-size: cover;
            background-position: center;
            transition: background-image 0.6s ease-in-out;
        }

        .dark-scrim {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(15px);
            z-index: 1;
        }

        header {
            position: relative;
            z-index: 10;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.5s ease;
        }

        .logo-section h1 {
            font-size: 18px;
            color: var(--accent-gold);
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .lang-switcher button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-light);
            padding: 10px 20px;
            margin-left: 6px;
            cursor: pointer;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .lang-switcher button.active, .lang-switcher button:hover {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #020617;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
        }

        /* Container for Main Content and Floating Navigation Controls */
        .content-area-wrapper {
            position: relative;
            z-index: 10;
            max-width: 1450px;
            width: 95%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        main {
            width: 100%;
            padding: 40px 60px;
            border-radius: 24px;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.9);
            height: 70vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
        }

        /* Floating Slide Buttons */
        .floating-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            user-select: none;
        }

        .floating-nav-btn:hover {
            background: var(--accent-gold);
            color: #020617;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
        }

        .floating-prev { left: -25px; }
        .floating-next { right: -25px; }

        /* Premium Glasscolor Themes */
        .glass-crimson { background: rgba(88, 14, 14, 0.35); backdrop-filter: blur(30px); box-shadow: inset 0 0 35px rgba(220, 38, 38, 0.2); }
        .glass-amber { background: rgba(80, 35, 4, 0.35); backdrop-filter: blur(30px); box-shadow: inset 0 0 35px rgba(217, 119, 6, 0.2); }
        .glass-emerald { background: rgba(4, 47, 31, 0.35); backdrop-filter: blur(30px); box-shadow: inset 0 0 35px rgba(5, 150, 105, 0.2); }
        .glass-sapphire { background: rgba(15, 23, 67, 0.35); backdrop-filter: blur(30px); box-shadow: inset 0 0 35px rgba(37, 99, 235, 0.2); }
        .glass-purple { background: rgba(53, 15, 105, 0.35); backdrop-filter: blur(30px); box-shadow: inset 0 0 35px rgba(139, 92, 246, 0.2); }

        /* Dynamic Header & Footer Matching */
        header.head-crimson, .footer-controls.foot-crimson { background: rgba(64, 10, 10, 0.6); }
        header.head-amber, .footer-controls.foot-amber { background: rgba(60, 25, 2, 0.6); }
        header.head-emerald, .footer-controls.foot-emerald { background: rgba(2, 35, 23, 0.6); }
        header.head-sapphire, .footer-controls.foot-sapphire { background: rgba(10, 15, 47, 0.6); }
        header.head-purple, .footer-controls.foot-purple { background: rgba(35, 10, 70, 0.6); }

        .slide-tag {
            font-size: 13px;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 8px;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 22px;
            color: #ffffff;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .framework-badge {
            display: inline-block;
            background: var(--accent-gold);
            color: #020617;
            padding: 3px 14px;
            font-weight: 800;
            border-radius: 6px;
            margin-right: 12px;
            font-size: 16px;
            vertical-align: middle;
            box-shadow: 0 4px 10px rgba(251, 191, 36, 0.3);
        }

        .main-content-text {
            font-size: 16.5px;
            line-height: 1.8;
            color: #f1f5f9;
            text-align: justify;
        }

        .main-content-text p {
            margin-bottom: 18px;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 40px;
            margin-top: 25px;
        }

        .chart-wrapper {
            background: rgba(2, 6, 23, 0.85);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            max-height: 330px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .table-filter {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(2, 6, 23, 0.9);
            color: #ffffff;
            font-size: 15px;
            backdrop-filter: blur(5px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 15px;
            background: rgba(2, 6, 23, 0.6);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid rgba(255,255,255,0.08);
            padding: 16px 18px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: rgba(2, 6, 23, 0.95);
            color: var(--accent-gold);
            font-weight: 700;
            border-bottom: 2px solid var(--accent-gold);
        }

        tr:nth-child(even) {
            background-color: rgba(255,255,255,0.02);
        }

        .styled-list {
            margin-left: 25px;
            margin-top: 10px;
        }

        .styled-list li {
            margin-bottom: 14px;
        }

        .quote-box {
            margin-top: 25px;
            border-left: 4px solid var(--accent-gold);
            padding-left: 20px;
            font-style: italic;
            color: #cbd5e1;
            background: rgba(255,255,255,0.02);
            padding-top: 15px;
            padding-bottom: 15px;
            border-radius: 0 12px 12px 0;
        }

        .footer-controls {
            position: relative;
            z-index: 10;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.5s ease;
        }

        .control-button {
            background: rgba(255,255,255,0.04);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .control-button:hover {
            background: var(--accent-gold);
            color: #020617;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }

        #slide-counter-bottom {
            font-weight: 600;
            color: var(--accent-gold);
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 10px; }
    </style>
</head>
<body>

<div class="dashboard-container" id="dynamic-bg">
    <div class="dark-scrim"></div>

    <header id="dynamic-header">
        <div class="logo-section">
            <h1 id="top-header-title">තුන්කල් දැක්ම | DEBT ELIMINATION NATIONAL ROADMAP</h1>
        </div>
        <div class="lang-switcher">
            <button onclick="switchLanguage('si')" id="lang-si" class="active">සිංහල</button>
            <button onclick="switchLanguage('en')" id="lang-en">English</button>
            <button onclick="switchLanguage('ta')" id="lang-ta">தமிழ்</button>
        </div>
    </header>

    <div class="content-area-wrapper">
        <button class="floating-nav-btn floating-prev" onclick="changeSlide(-1)">&#10094;</button>
        
        <main id="dynamic-glass-card">
            <div class="slide-tag" id="slide-index-label">පිටුව 1 / 5</div>
            <h2 id="slide-main-title">පූරණය වෙමින් පවතී...</h2>
            <div class="main-content-text" id="slide-main-body"></div>
        </main>

        <button class="floating-nav-btn floating-next" onclick="changeSlide(1)">&#10095;</button>
    </div>

    <div class="footer-controls" id="dynamic-footer">
        <button class="control-button" id="prev-slide-btn" onclick="changeSlide(-1)">PREV / පෙර</button>
        <div id="slide-counter-bottom"></div>
        <button class="control-button" id="next-slide-btn" onclick="changeSlide(1)">NEXT / ඊළඟ</button>
    </div>
</div>

                    labels: labels,
                    datasets: [{
                        label: selectedLang === 'si' ? 'ග්‍රාමීය ප්‍රාග්ධන රඳවාගැනීම %' : (selectedLang === 'ta' ? 'கிராமப்புற மூலதனத் தக்கவைப்பு %' : 'Rural Capital Retention %'),
                        data: [25, 55, 80, 94, 99],
                        borderColor: '#fbbf24',
                        backgroundColor: 'rgba(251, 191, 36, 0.15)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#ffffff' } } },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { color: '#ffffff' } },
                        y: { grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { color: '#ffffff' }, min: 0, max: 100 }
                    }
                }
            });
        }
    }

    function paintDashboard() {
        const structuralData = datasetMatrix[selectedLang][activeSlideIndex];
        const localizationLabels = viewLabels[selectedLang];
        
        document.getElementById('top-header-title').innerText = localizationLabels.headerText;
        document.getElementById('window-title').innerText = localizationLabels.headerText;
        
        document.getElementById('slide-main-title').innerHTML = structuralData.title;
        document.getElementById('slide-main-body').innerHTML = structuralData.bodyHtml;
        
        const userSearch = document.getElementById('tableFilterInput');
        if (userSearch) userSearch.placeholder = localizationLabels.searchPlaceholder;
        
        const h1 = document.getElementById('col-h1'); if (h1) h1.innerText = localizationLabels.tableHeaders[0];
        const h2 = document.getElementById('col-h2'); if (h2) h2.innerText = localizationLabels.tableHeaders[1];
        const h3 = document.getElementById('col-h3'); if (h3) h3.innerText = localizationLabels.tableHeaders[2];
        
        const totalSlides = datasetMatrix[selectedLang].length;
        const outText = `${localizationLabels.pageLabel} ${activeSlideIndex + 1} / ${totalSlides}`;
        document.getElementById('slide-index-label').innerText = outText;
        document.getElementById('slide-counter-bottom').innerText = outText;
        
        document.getElementById('dynamic-bg').style.backgroundImage = `url('${structuralData.bgImage}')`;
        
        const cardNode = document.getElementById('dynamic-glass-card');
        const headerNode = document.getElementById('dynamic-header');
        const footerNode = document.getElementById('dynamic-footer');
        
        cardNode.className = ''; cardNode.classList.add(structuralData.glassClass);
        headerNode.className = ''; headerNode.classList.add(structuralData.headClass);
        footerNode.className = ''; footerNode.classList.add(structuralData.footClass);

        setTimeout(renderActiveCharts, 60);
    }

    function changeSlide(directionOffset) {
        const totalSlides = datasetMatrix[selectedLang].length;
        activeSlideIndex += directionOffset;
        
        if (activeSlideIndex >= totalSlides) {
            activeSlideIndex = 0;
        } else if (activeSlideIndex < 0) {
            activeSlideIndex = totalSlides - 1;
        }
        
        paintDashboard();
    }

    function switchLanguage(langKey) {
        selectedLang = langKey;
        document.getElementById('lang-si').classList.remove('active');
        document.getElementById('lang-en').classList.remove('active');
        document.getElementById('lang-ta').classList.remove('active');
        document.getElementById('lang-' + langKey).classList.add('active');
        paintDashboard();
    }

    function filterTableRows() {
        let input = document.getElementById("tableFilterInput");
        let filter = input.value.toUpperCase();
        let table = document.getElementById("contentDataTable");
        let tr = table.getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) {
            let rowText = tr[i].textContent || tr[i].innerText;
            if (rowText.toUpperCase().indexOf(filter) > -1) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }

    window.onload = function() {
        paintDashboard();
    };
</script>

</body>
</html>
