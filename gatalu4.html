        let activeSlideIndex = 0;
        let selectedLang = 'ta'; // Defaulting to Tamil on start

        function paintDashboard() {
            const currentData = datasetMatrix[selectedLang][activeSlideIndex];
            if (!currentData) return;
            
            document.getElementById('slide-letter').innerText = currentData.letter;
            document.getElementById('meta-display').innerText = currentData.meta;
            document.getElementById('slide-main-title').innerText = currentData.title;
            document.getElementById('slide-main-desc').innerText = currentData.desc;
            document.getElementById('buddhist-desc').innerText = currentData.buddhist;

            const matrixBox = document.getElementById('slide-matrix-box');
            matrixBox.innerHTML = '';
            currentData.matrix.forEach(item => {
                const li = document.createElement('li');
                li.className = 'matrix-item';
                li.innerText = item;
                matrixBox.appendChild(li);
            });

            const headerRow = document.getElementById('table-header-row');
            headerRow.innerHTML = `
                <th>${currentData.th1}</th>
                <th>${currentData.th2}</th>
                <th>${currentData.th3}</th>
            `;

            const tableBody = document.getElementById('table-body-rows');
            tableBody.innerHTML = '';
            currentData.table.forEach(rowData => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${rowData[0]}</strong></td>
                    <td style="color: var(--danger-red); font-weight: 600;">${rowData[1]}</td>
                    <td style="color: var(--success-green); font-weight: 600;">${rowData[2]}</td>
                `;
                tableBody.appendChild(tr);
            });

            document.getElementById('btn-prev').disabled = (activeSlideIndex === 0);
            document.getElementById('btn-next').disabled = (activeSlideIndex === datasetMatrix[selectedLang].length - 1);
            
            // Labels translation based on active language
            if(selectedLang === 'ta') {
                document.getElementById('main-brand-title').innerText = "THREE-WAY VISION | REGIONAL ENTREPRENEURSHIP EQUALIZATION SYSTEM";
                document.getElementById('section-buddhist-title').innerText = "அரசாட்சி மற்றும் சம வாய்ப்புகள் குறித்த பௌத்த தத்துவக் கோட்பாடு";
                document.getElementById('section-data-title').innerText = "மூலதனம் மற்றும் தொழில்முனைவோர் வெளிப்படைத்தன்மை அட்டவணை";
                document.getElementById('meta-tag').innerText = "MASTER MATRIX PILLAR";
                document.getElementById('footer-text').innerText = "THREE-WAY VISION © 2026 | PILLAR 5: REGIONAL ENTREPRENEURSHIP MATRIX";

                document.getElementById('section-buddhist-title').innerText = "රාජ්‍ය පාලනය සහ අවස්ථා සමානතාවය පිළිබඳ බුද්ධ උපදේශිත හරය";

                document.getElementById('meta-tag').innerText = "ප්‍රධාන මාස්ටර් මැට්‍රික්ස් කුළුණ";
                document.getElementById('footer-text').innerText = "තුන්කල් දැක්ම © 2026 | කුළුණ 5: ප්‍රාදේශීය ව්‍යවසායකත්ව මැට්‍රික්ස්";

                document.getElementById('btn-next').innerText = "ඉදිරියට →";

                document.getElementById('main-brand-title').innerText = "THREE-WAY VISION | REGIONAL ENTREPRENEURSHIP EQUALIZATION SYSTEM";
                document.getElementById('section-buddhist-title').innerText = "Canonical Buddhist Doctrine on Governance & Equal Opportunity";
                document.getElementById('section-data-title').innerText = "Capital & Entrepreneurship Transparency Matrix Table";
                document.getElementById('meta-tag').innerText = "MASTER MATRIX PILLAR";
                document.getElementById('footer-text').innerText = "THREE-WAY VISION © 2026 | PILLAR 5: REGIONAL ENTREPRENEURSHIP MATRIX";
                document.getElementById('btn-prev').innerText = "← BACK";
                document.getElementById('btn-next').innerText = "NEXT →";
            }
        }

        function changeSlide(direction) {
            activeSlideIndex += direction;
            if(activeSlideIndex < 0) activeSlideIndex = 0;
            if(activeSlideIndex >= datasetMatrix[selectedLang].length) {
                activeSlideIndex = datasetMatrix[selectedLang].length - 1;
            }
            paintDashboard();
        }

        function switchLanguage(langKey) {
            selectedLang = langKey;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('lang-' + langKey).classList.add('active');
            paintDashboard();
        }

        window.onload = function() {
            paintDashboard();
        };
    </script>
